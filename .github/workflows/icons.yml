name: build-icons
on:
  push:
    branches: [main]
    paths: ["icons-src/**", ".github/workflows/icons.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Decode PNG icons (main)
        run: |
          for f in icons-src/*.b64; do base64 -d "$f" > "$(basename "${f%.b64}")"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git diff --cached --quiet || git commit -m "Build PNG icons"
          git push origin HEAD:main
      - name: Sync site files to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git checkout main -- index.html style.css app.js data.js manifest.json .nojekyll apple-touch-icon.png icon-192.png icon-512.png
          git add -A
          git diff --cached --quiet || git commit -m "Sync site from main"
          git push origin gh-pages
